<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reels ID Finder</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c27;
      --border: #2a2a3d;
      --accent: #7c6af7;
      --accent2: #f06292;
      --text: #e8e8f0;
      --muted: #6b6b8a;
      --success: #4ade80;
      --mono: 'Space Mono', monospace;
      --sans: 'DM Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* Background grid */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(124,106,247,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(124,106,247,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* Header */
    .header {
      margin-bottom: 40px;
      animation: fadeDown 0.5s ease;
    }

    .header .tag {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--accent);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header .tag::before {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--accent);
    }

    h1 {
      font-family: var(--mono);
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      margin-top: 8px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 300;
    }

    /* Config panel */
    .config-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      animation: fadeUp 0.5s ease 0.1s both;
    }

    .config-panel label {
      display: block;
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 12px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus, input[type="password"]:focus {
      border-color: var(--accent);
    }

    input::placeholder { color: var(--muted); }

    .fetch-btn {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .fetch-btn:hover { background: #6a59e0; transform: translateY(-1px); }
    .fetch-btn:active { transform: translateY(0); }
    .fetch-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* Spinner */
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    /* Error */
    .error-box {
      background: rgba(240, 98, 146, 0.1);
      border: 1px solid rgba(240, 98, 146, 0.3);
      border-radius: 8px;
      padding: 12px 16px;
      margin-top: 16px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--accent2);
      display: none;
    }

    /* Results */
    .results-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      animation: fadeUp 0.4s ease;
    }

    .results-count {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
    }

    .results-count span {
      color: var(--accent);
      font-weight: 700;
    }

    /* Reel card */
    .reel-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 20px;
      margin-bottom: 10px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      animation: fadeUp 0.3s ease both;
      transition: border-color 0.2s;
    }

    .reel-card:hover { border-color: var(--accent); }

    .reel-info { min-width: 0; }

    .reel-date {
      font-size: 11px;
      font-family: var(--mono);
      color: var(--muted);
      margin-bottom: 4px;
    }

    .reel-id {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--text);
      font-weight: 700;
      margin-bottom: 6px;
      word-break: break-all;
    }

    .reel-link a {
      font-size: 12px;
      color: var(--accent);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .reel-link a:hover { text-decoration: underline; }

    .reel-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-shrink: 0;
    }

    .reel-caption {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
      line-height: 1.4;
    }

    .copy-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .copy-btn.copied {
      border-color: var(--success);
      color: var(--success);
    }

    .view-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      text-align: center;
      white-space: nowrap;
    }

    .view-btn:hover {
      border-color: var(--muted);
      color: var(--text);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 14px;
    }

    .empty .icon { font-size: 40px; margin-bottom: 12px; }

    /* Animations */
    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 560px) {
      .input-row { grid-template-columns: 1fr; }
      .reel-card { grid-template-columns: 1fr; }
      .reel-actions { flex-direction: row; }
    }
  </style>
</head>
<body>
  <div class="container">

    <div class="header">
      <div class="tag">Instagram Tool</div>
      <h1>Reels <span>ID</span> Finder</h1>
      <p class="subtitle">Fetch all your reel IDs in one click</p>
    </div>

    <div class="config-panel">
      <div class="input-row">
        <div>
          <label>Instagram User ID</label>
          <input type="text" id="igUserId" placeholder="17841443788151017" />
        </div>
        <div>
          <label>Access Token</label>
          <input type="password" id="accessToken" placeholder="IGAA..." />
        </div>
      </div>
      <button class="fetch-btn" id="fetchBtn" onclick="fetchReels()">
        <div class="spinner" id="spinner"></div>
        <span id="btnText">Fetch My Reels</span>
      </button>
      <div class="error-box" id="errorBox"></div>
    </div>

    <div id="results"></div>

  </div>

  <script>
    // Persist inputs in localStorage
    window.onload = () => {
      const saved = JSON.parse(localStorage.getItem('reels_config') || '{}');
      if (saved.igUserId) document.getElementById('igUserId').value = saved.igUserId;
      if (saved.accessToken) document.getElementById('accessToken').value = saved.accessToken;
    };

    async function fetchReels() {
      const igUserId = document.getElementById('igUserId').value.trim();
      const accessToken = document.getElementById('accessToken').value.trim();
      const errorBox = document.getElementById('errorBox');
      const resultsDiv = document.getElementById('results');
      const btn = document.getElementById('fetchBtn');
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btnText');

      errorBox.style.display = 'none';
      resultsDiv.innerHTML = '';

      if (!igUserId || !accessToken) {
        errorBox.textContent = 'Please enter both your Instagram User ID and Access Token.';
        errorBox.style.display = 'block';
        return;
      }

      // Save to localStorage
      localStorage.setItem('reels_config', JSON.stringify({ igUserId, accessToken }));

      // Loading state
      btn.disabled = true;
      spinner.style.display = 'block';
      btnText.textContent = 'Fetching...';

      try {
        const url = `/api/reels-data`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) throw new Error(data.error.message);

        const reels = data;

        if (reels.length === 0) {
          resultsDiv.innerHTML = `
            <div class="empty">
              <div class="icon">🎬</div>
              No reels found on this account.
            </div>`;
          return;
        }

        let html = `
          <div class="results-header">
            <div class="results-count">Found <span>${reels.length}</span> reels</div>
          </div>`;

        reels.forEach((reel, i) => {
          const date = new Date(reel.timestamp).toLocaleDateString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric'
          });
          html += `
            <div class="reel-card" style="animation-delay: ${i * 0.05}s">
              <div class="reel-info">
                <div class="reel-date">${date}</div>
                <div class="reel-caption">${reel.caption ? reel.caption.substring(0, 100) + '...' : 'No caption'}</div>
                <div class="reel-id">${reel.id}</div>
                <div class="reel-link">
                  <a href="${reel.permalink}" target="_blank">
                    ↗ View on Instagram
                  </a>
                </div>
              </div>
              <div class="reel-actions">
                <button class="copy-btn" onclick="copyId(this, '${reel.id}')">Copy ID</button>
                <a class="view-btn" href="${reel.permalink}" target="_blank">Open</a>
              </div>
            </div>`;
        });

        resultsDiv.innerHTML = html;

      } catch (err) {
        errorBox.textContent = `Error: ${err.message}`;
        errorBox.style.display = 'block';
      } finally {
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Fetch My Reels';
      }
    }

    function copyId(btn, id) {
      navigator.clipboard.writeText(id).then(() => {
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(() => {
          btn.textContent = 'Copy ID';
          btn.classList.remove('copied');
        }, 2000);
      });
    }

    // Allow Enter key to submit
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') fetchReels();
    });
  </script>
</body>
</html>
